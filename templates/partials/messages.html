{% if messages %}
<div class="mb-4 space-y-2">
  {% for message in messages %}
  <div class="rounded-md px-4 py-3 text-sm ring-1
    {% if message.tags == 'success' %}bg-emerald-50 text-emerald-800 ring-emerald-600/20
    {% elif message.tags == 'error' %}bg-rose-50 text-rose-800 ring-rose-600/20
    {% elif message.tags == 'warning' %}bg-amber-50 text-amber-900 ring-amber-600/20
    {% else %}bg-sky-50 text-sky-800 ring-sky-600/20{% endif %}">
    {{ message }}
  </div>
  {% endfor %}
</div>
{% endif %}
