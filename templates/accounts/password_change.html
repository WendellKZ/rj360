{% extends "base.html" %}
{% block titulo %}Alterar senha{% endblock %}
{% block conteudo %}
<div class="mx-auto max-w-lg rounded-xl bg-white p-6 shadow ring-1 ring-slate-200">
  <h1 class="mb-4 text-lg font-semibold">Alterar senha</h1>
  <form method="post" class="space-y-4">
    {% csrf_token %}
    {% for campo in form %}{% include "partials/campo.html" with campo=campo %}{% endfor %}
    <button class="rounded-md bg-emerald-600 px-4 py-2 text-white hover:bg-emerald-700">Salvar</button>
  </form>
</div>
{% endblock %}
